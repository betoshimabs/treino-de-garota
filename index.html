<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Brabita" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brabita" />
    <meta name="description" content="Seu treino, do jeito que aconteceu." />
    <link rel="icon" href="%BASE_URL%brabita-favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brabita-apple-touch-icon.png" />
    <title>Brabita — diário de treino</title>
  </head>
  <body>
    <style>
      #app-opening{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ea6b7e;color:#171512;font-family:system-ui,sans-serif;transition:opacity .3s ease}
      #app-opening.opening-leave{opacity:0;pointer-events:none}
      .opening-art{position:relative;width:min(100%,420px);aspect-ratio:3/2}
      .opening-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
      .opening-art [hidden]{display:none}
      #app-opening p{font-size:14px;text-align:center;padding:0 24px}
      .opening-recovery{text-align:center;max-width:340px}
      .opening-recovery button{min-height:48px;padding:10px 20px;border:0;border-radius:12px;background:#171512;color:#fffdf8;font:inherit}
      @media(prefers-reduced-motion:reduce){#app-opening{transition:none}}
    </style>
    <div id="app-opening" role="status" aria-label="Abrindo a Brabita">
      <div class="opening-art" aria-hidden="true">
        <img data-opening-poster src="%BASE_URL%brand-motion/opening-poster.webp" width="1080" height="720" alt="" hidden />
        <img data-opening-animation src="%BASE_URL%brand-motion/opening.webp" width="1080" height="720" alt="" fetchpriority="high" />
      </div>
      <div class="opening-recovery" hidden><p>Está demorando mais que o esperado. Você pode tentar abrir novamente.</p><button type="button">Tentar novamente</button></div>
    </div>
    <div id="root" inert></div>
    <script src="%BASE_URL%brand-motion/opening.js"></script>
    <noscript><style>#app-opening{display:none}</style>Ative o JavaScript no navegador para abrir a Brabita.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
